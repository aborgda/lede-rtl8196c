name: Build Realtek Linux 4.4

on:
  push:
    branches: [ realtek ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [rtl8198c, rtl8198]
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtek
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ clang flex bison gawk gettext libncurses5-dev libssl-dev python2 python3 rsync unzip file wget git zlib1g-dev libelf-dev xsltproc bc cpio
      - name: Prepare feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Configure RTL8198C
        if: matrix.target == 'rtl8198c'
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198c=y
          CONFIG_TARGET_BOARD="realtek"
          CONFIG_TARGET_ARCH_PACKAGES="realtek_24kc"
          CONFIG_CPU_TYPE="lexra"
          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_swconfig=y
          EOF
          make defconfig
      - name: Configure RTL8198
        if: matrix.target == 'rtl8198'
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198=y
          CONFIG_TARGET_BOARD="realtek"
          CONFIG_TARGET_ARCH_PACKAGES="realtek_24kc"
          CONFIG_CPU_TYPE="lexra"
          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_swconfig=y
          EOF
          make defconfig
      - name: Build
        run: |
          make -j1 V=s target/linux/compile
          make -j1 V=s target/linux/install
          make -j1 V=s target/linux/image/compile
      - name: Verify images
        run: |
          set -eux
          find bin/targets/realtek/${{ matrix.target }} -maxdepth 1 -type f -print
          test -n "$(find bin/targets/realtek/${{ matrix.target }} -maxdepth 1 -type f)"
      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: realtek-linux-4.4-${{ matrix.target }}
          path: bin/targets/realtek/${{ matrix.target }}/**
          if-no-files-found: error