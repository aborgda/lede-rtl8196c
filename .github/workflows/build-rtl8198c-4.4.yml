name: Build RTL8198C 4.4 GN866 SK337

on:
  push:
    branches: [ realtek ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtek
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ git wget rsync unzip file             python3 python-is-python3 perl flex bison gawk gettext             libncurses5-dev libssl-dev zlib1g-dev libelf-dev xsltproc time bc cpio
      - name: Prepare feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Configure RTL8198C
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198c=y
          CONFIG_TARGET_BOARD="realtek"
          CONFIG_CPU_TYPE="lexra"
          CONFIG_TARGET_OPTIMIZATION="-Os -pipe -fno-caller-saves -fno-plt -fhonour-copts"
          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_swconfig=y
          EOF
          make defconfig
      - name: Build host tools and toolchain
        run: |
          make -j2 V=s tools/compile
          make -j2 V=s toolchain/compile
      - name: Build Linux 4.4 and images
        run: |
          make -j2 V=s target/linux/compile
          make -j2 V=s target/linux/install
          make -j2 V=s target/linux/image/compile
      - name: Verify SK337 image layout
        run: |
          set -eux
          find bin/targets/realtek/rtl8198c -maxdepth 1 -type f -printf '%f %s bytes\n'
          python3 - <<'PY'
          import struct
          import glob
          p=glob.glob('bin/targets/realtek/rtl8198c/*SK337*factory.bin')
          assert p, 'SK337 factory image missing'
          d=open(p[0],'rb').read()
          assert len(d)==0x2000000, hex(len(d))
          assert d[0x31000:0x31004]==b'cr6c'
          assert d[0x1fdc12:0x1fdc16]==b'r6cr'
          print('SK337 layout OK:', hex(len(d)), 'cr6c@0x31000', 'r6cr@0x1fdc12')
          PY
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: rtl8198c-4.4-gn866-sk337
          path: bin/targets/realtek/rtl8198c/**
          if-no-files-found: error
