name: Build Realtek RTL8198C RTL8198 Linux 4.4

on:
  push:
    branches: [ realtek ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-11 g++-11 clang flex bison gawk gettext             libncurses-dev libssl-dev python3 python-is-python3 rsync unzip file wget git             zlib1g-dev libelf-dev libtool-bin autopoint
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 110
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 110
      - name: Prepare feeds
        run: |
          rm -rf feeds
          mkdir -p feeds
      - name: Configure RTL8198C and RTL8198
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_BOARD="realtek"
          CONFIG_TARGET_ARCH_PACKAGES="realtek_lexra"
          CONFIG_TARGET_realtek_rtl8198c=y
          CONFIG_TARGET_realtek_rtl8198=y
          CONFIG_CPU_TYPE="lexra"
          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_kmod-rtl8192cd=y
          CONFIG_PACKAGE_kmod-rtl8192er=y
          CONFIG_PACKAGE_kmod-rtl8812er=y
          CONFIG_PACKAGE_wpad-mini=y
          CONFIG_PACKAGE_swconfig=y
          EOF
          make FORCE=1 defconfig
      - name: Build host tools and toolchain
        run: |
          make FORCE=1 -j1 V=s tools/compile
          make FORCE=1 -j1 V=s toolchain/compile
      - name: Prepare Linux 4.4 and inject Realtek WLAN driver
        run: |
          set -eux
          make FORCE=1 -j1 V=s target/linux/prepare
          LINUX_DIR="$(find build_dir -type f -path '*/linux-4.4.*/Makefile' -print -quit | xargs -r dirname)"
          test -n "$LINUX_DIR"
          git clone --depth 1 https://github.com/cgoder/openwrt_rtk.git /tmp/openwrt_rtk
          cp -a /tmp/openwrt_rtk/rtk_openwrt_sdk/target/linux/realtek/files/drivers/net/wireless/rtl8192cd "$LINUX_DIR/drivers/net/wireless/"
          printf '\nsource "drivers/net/wireless/rtl8192cd/Kconfig"\n' >> "$LINUX_DIR/drivers/net/wireless/Kconfig"
          printf '\nobj-$(CONFIG_RTL8192CD) += rtl8192cd/\n' >> "$LINUX_DIR/drivers/net/wireless/Makefile"
          cat >> "$LINUX_DIR/.config" <<'EOF'
          CONFIG_RTL8192CD=m
          CONFIG_USE_PCIE_SLOT_0=y
          CONFIG_SLOT_0_8192EE=y
          CONFIG_WLAN_HAL_8192EE=y
          CONFIG_RTL_ODM_WLAN_DRIVER=y
          CONFIG_USE_PCIE_SLOT_1=y
          CONFIG_SLOT_1_8812=y
          CONFIG_RTL_92C_SUPPORT=y
          CONFIG_RTL_8812_SUPPORT=y
          CONFIG_RTL_ODM_WLAN_DRIVER=y
          CONFIG_OPENWRT_SDK=y
          EOF
          make -C "$LINUX_DIR" olddefconfig
      - name: Build RTL8198C Linux 4.4
        run: |
          make FORCE=1 -j1 V=s target/linux/compile
          make FORCE=1 -j1 V=s target/linux/install
          make FORCE=1 -j1 V=s target/linux/image/compile
      - name: Verify images
        run: |
          set -eux
          find bin/targets/realtek -maxdepth 2 -type f -print
          test -d bin/targets/realtek/rtl8198c
          test -d bin/targets/realtek/rtl8198
          find bin/targets/realtek/rtl8198c bin/targets/realtek/rtl8198 -type f -print
      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: realtek-rtl8198-linux44
          path: bin/targets/realtek/**
          if-no-files-found: error
