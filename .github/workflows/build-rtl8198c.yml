name: Build RTL8198C GN866 AC and SK337

on:
  push:
    branches: [ realtek ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realtek
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-11 g++-11             flex bison gawk gettext libncurses-dev libssl-dev             python3 python-is-python3 rsync unzip file wget git             zlib1g-dev libelf-dev perl
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 110
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 110
      - name: Prepare build tree
        run: |
          rm -rf feeds
          mkdir -p feeds
      - name: Configure GN866 and SK337
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198c=y
          CONFIG_TARGET_BOARD="realtek"
          CONFIG_TARGET_ARCH_PACKAGES="realtek_lexra"
          CONFIG_CPU_TYPE="lexra"
          CONFIG_TARGET_DEVICE_realtek_rtl8198c_GN866_AC=y
          CONFIG_TARGET_DEVICE_realtek_rtl8198c_SK337=y
          EOF
          make FORCE=1 defconfig
      - name: Build host tools and toolchain
        run: |
          make FORCE=1 -j2 tools/compile
          make FORCE=1 -j2 toolchain/compile
      - name: Prepare Linux 4.4 and inject Realtek WLAN driver
        run: |
          set -eux
          make FORCE=1 -j1 V=s target/linux/prepare
          LINUX_DIR="$(find build_dir -type f -path '*/linux-4.4.*/Makefile' -print -quit | xargs -r dirname)"
          test -n "$LINUX_DIR"
          git clone --depth 1 https://github.com/cgoder/openwrt_rtk.git /tmp/openwrt_rtk
          cp -a /tmp/openwrt_rtk/rtk_openwrt_sdk/target/linux/realtek/files/drivers/net/wireless/rtl8192cd "$LINUX_DIR/drivers/net/wireless/"
          grep -q 'source "drivers/net/wireless/rtl8192cd/Kconfig"' "$LINUX_DIR/drivers/net/wireless/Kconfig" || echo 'source "drivers/net/wireless/rtl8192cd/Kconfig"' >> "$LINUX_DIR/drivers/net/wireless/Kconfig"
          grep -q 'obj-$(CONFIG_RTL8192CD) += rtl8192cd/' "$LINUX_DIR/drivers/net/wireless/Makefile" || echo 'obj-$(CONFIG_RTL8192CD) += rtl8192cd/' >> "$LINUX_DIR/drivers/net/wireless/Makefile"
          cat >> "$LINUX_DIR/.config" <<'EOF'
          CONFIG_RTL8192CD=m
          CONFIG_USE_PCIE_SLOT_0=y
          CONFIG_SLOT_0_92C=y
          CONFIG_USE_PCIE_SLOT_1=y
          CONFIG_SLOT_1_8812=y
          CONFIG_RTL_92C_SUPPORT=y
          CONFIG_RTL_8812_SUPPORT=y
          CONFIG_RTL_ODM_WLAN_DRIVER=y
          CONFIG_OPENWRT_SDK=y
          EOF
          make -C "$LINUX_DIR" olddefconfig
      - name: Build Linux and WLAN package
        run: |
          make FORCE=1 -j1 V=s target/linux/compile
          make FORCE=1 -j1 V=s package/kernel/rtl8192cd/compile
          make FORCE=1 -j1 V=s package/kernel/rtl8192cd/install
          make FORCE=1 -j1 V=s target/linux/install
          make FORCE=1 -j1 V=s target/linux/image/compile
      - name: Verify images
        run: |
          set -eux
          find bin/targets/realtek -maxdepth 2 -type f -print
          test -d bin/targets/realtek/rtl8198c
          find bin/targets/realtek/rtl8198c -type f
      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: rtl8198c-gn866-sk337
          path: bin/targets/realtek/rtl8198c/**
          if-no-files-found: error
